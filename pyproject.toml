[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odrive"
version = "1.0.0"
description = "Unified Cloud Drive Manager for Omarchy Linux — mount, monitor, and manage Google Drive, OneDrive, Dropbox, Nextcloud, and more."
readme = "README.md"
authors = [
    { name = "TiniTinyTerminator" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = [
    "cloud",
    "drive",
    "rclone",
    "storage",
    "mount",
    "onedrive",
    "google-drive",
    "nextcloud",
    "dropbox",
    "omarchy",
    "quickshell",
    "hyprland"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/TiniTinyTerminator/ODrive"
Repository = "https://github.com/TiniTinyTerminator/ODrive.git"
Issues = "https://github.com/TiniTinyTerminator/ODrive/issues"

[project.scripts]
odrive = "odrive.cli:main"

[tool.setuptools]
package-dir = {"" = "lib"}

[tool.setuptools.packages.find]
where = ["lib"]
